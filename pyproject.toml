[project]
name = "jsgh"
version = "0.1.0"
description = "JSGH Algorithms Project"
requires-python = ">=3.14"
dependencies = [
    "numpy>=2.0",
    "plotly>=6.0",
    "colorama>=0.4",
    "pyinstrument>=5.0",
    "pandas>=2.0",
    "openpyxl>=3.0",
    "pyttsx3>=2.99",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
